<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>RD100S emu — panel de operación</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>RD100S emu</h1>
    <div id="session-info" class="session-info">conectando…</div>
    <div id="link-metrics" class="link-metrics"></div>
  </header>

  <section class="toolbar">
    <label>Actor: <input id="actor-input" type="text" placeholder="tu nombre" /></label>
    <span id="counters" class="counters"></span>
    <button id="release-all-btn">Liberar todas</button>
    <button id="download-btn">Descargar sesión</button>
    <button id="reload-btn" title="Vuelve a leer el fichero de configuracion cargado. Arranca sesion nueva.">Recargar configuración</button>
  </section>

  <main>
    <section id="signals-panel">
      <h2>Señales</h2>
      <input id="filter-input" type="text" placeholder="filtrar por nombre…" />
      <div id="signal-list"></div>
    </section>

    <aside id="sidebar">
      <section id="events-panel">
        <h2>Registro de eventos</h2>
        <div id="event-log"></div>
      </section>

      <section id="degradation-panel">
        <h2>Degradaciones UDP (RD100S-ENC-UDP)</h2>
        <div class="degrade-row">
          <label>Pérdida</label>
          <input id="degrade-loss" type="number" min="0" max="1" step="0.05" value="0" />
          <button data-degrade-apply="loss">aplicar</button>
        </div>
        <div class="degrade-row">
          <label>Ráfaga (ms)</label>
          <input id="degrade-burst" type="number" min="0" step="50" value="1000" />
          <button data-degrade-apply="burst">activar</button>
        </div>
        <div class="degrade-row">
          <label>Duplicación</label>
          <input id="degrade-duplicate" type="number" min="0" max="1" step="0.05" value="0" />
          <button data-degrade-apply="duplicate">aplicar</button>
        </div>
        <div class="degrade-row">
          <label>Reordenamiento (ms)</label>
          <input id="degrade-reorder" type="number" min="0" step="10" value="0" />
          <button data-degrade-apply="reorder">aplicar</button>
        </div>
        <div class="degrade-row">
          <label>Jitter (ms)</label>
          <input id="degrade-jitter" type="number" min="0" step="5" value="0" />
          <button data-degrade-apply="jitter">aplicar</button>
        </div>
        <div class="degrade-row">
          <label>Congelación</label>
          <button id="degrade-freeze-toggle" data-degrade-toggle="freeze">activar</button>
        </div>
        <div class="degrade-row">
          <label>Encoder inválido</label>
          <button id="degrade-encoder_invalid-toggle" data-degrade-toggle="encoder_invalid">activar</button>
        </div>
        <div class="degrade-row">
          <label>Salto de secuencia</label>
          <input id="degrade-seq_jump" type="number" step="1" value="1000" />
          <button data-degrade-apply="seq_jump">aplicar</button>
        </div>
        <div class="degrade-row">
          <label>Silencio total</label>
          <button id="degrade-silence-toggle" data-degrade-toggle="silence">activar</button>
        </div>
      </section>

      <section id="assertions-panel">
        <h2>Aserciones</h2>
        <div id="assertions-list"></div>
      </section>

      <section id="scenarios-panel">
        <h2>Escenarios</h2>
        <div id="scenario-status">ninguno en curso</div>
        <button id="scenario-abort-btn" disabled>Abortar escenario en curso</button>
        <div id="scenarios-list"></div>
      </section>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
